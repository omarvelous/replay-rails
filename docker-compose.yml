services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # chrome:
  #   image: selenium/standalone-chromium:latest
  #   ports:
  #     - "4444:4444"
  #     - "7900:7900"
  #   shm_size: 2gb

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/dev
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      # chrome:
      #   condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432
      RAILS_ENV: development
      SELENIUM_URL: http://chrome:4444/wd/hub
      WEB_HOST: web
    volumes:
      - .:/rails
      - /rails/node_modules
      - bundle_cache:/usr/local/bundle
    stdin_open: true
    tty: true

  player:
    image: node:22-slim
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    working_dir: /app
    ports:
      - "3100:3100"
    depends_on:
      - web
    environment:
      API_URL: http://web:3000
      WS_URL: ws://web:3000
      VITE_CABLE_URL: ws://play.replay.localhost:3000
    volumes:
      - ./player-app:/app
      - player_node_modules:/app/node_modules

  storybook:
    image: node:22-slim
    command: sh -c "npm install && npm run storybook -- --host 0.0.0.0 --no-open"
    working_dir: /app
    ports:
      - "6006:6006"
    volumes:
      - ./player-app:/app
      - player_node_modules:/app/node_modules
    profiles:
      - storybook

volumes:
  postgres_data:
  bundle_cache:
  player_node_modules:
