<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RePlay — Coming Soon</title>
  <meta name="description" content="Digital signage for real estate brokerages. Coming soon.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030712;
      color: #ffffff;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 28rem;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 3rem;
    }

    .logo-icon {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, #6366f1, #14b8a6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 1.1rem;
      height: 1.1rem;
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo-text b {
      color: #6366f1;
    }

    h1 {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      h1 { font-size: 2.25rem; }
      p { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M8 6.5v11l9-5.5-9-5.5z" fill="#fff"/></svg>
      </div>
      <span class="logo-text">Re<b>Play</b></span>
    </div>

    <h1>Coming Soon</h1>
    <p>Digital signage for real estate brokerages.</p>

</html>
